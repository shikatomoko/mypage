<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しかこ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">TRPG PROFILE</p>
      <h1 id="page-title">しかこ</h1>
      <nav class="page-actions" aria-label="ページ移動">
        <a class="page-link" href="character-sheets.html">キャラシ一覧</a>
        <a class="page-link" href="landmine.html">地雷要素について</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card" id="likes">
      <h2>好きな要素</h2>
      <ul class="tag-list" id="likes-list"></ul>
    </section>

    <section class="card" id="completed-scenarios">
      <h2>通過済みシナリオ</h2>
      <p class="scenario-count">計 <strong id="completed-count">0</strong> 本</p>

      <div class="tab-bar" id="completed-tabs"></div>
      <div id="completed-panels"></div>
    </section>

    <section class="card" id="gm-scenarios">
      <h2>回せるシナリオ</h2>
      <p class="scenario-count">計 <strong id="gm-count">0</strong> 本</p>
      <div id="gm-content"></div>
    </section>

    <section class="card" id="display-gallery">
      <div class="slider-wrapper">
        <button class="slider-btn slider-prev" aria-label="前へ">&#8249;</button>
        <div class="slider-track-outer">
          <div class="slider-track" id="slider-track"></div>
        </div>
        <button class="slider-btn slider-next" aria-label="次へ">&#8250;</button>
      </div>
      <div class="slider-dots" id="slider-dots"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text">© 2026 しかこ / shikako9861</p>
    </div>
  </footer>
  <script src="data/profile.js"></script>
  <script src="data/completed.js"></script>
  <script src="data/gm.js"></script>
  <script src="data/gallery.js"></script>
  <script src="app.js"></script>
